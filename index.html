<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามงานเจ้าหน้าที่</title>
  <!-- นำเข้า CSS สำหรับ GitHub Pages -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>ระบบติดตามงานเจ้าหน้าที่</h1>
      <div id="userBadge" class="user-badge">กำลังโหลด...</div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview">ภาพรวม</button>
      <button class="tab-btn" data-tab="mytasks">งานของฉัน</button>
      <button class="tab-btn" id="allTasksTabBtn" data-tab="alltasks" style="display:none;">งานทั้งหมด</button>
      <button class="tab-btn" data-tab="addtask">เพิ่มงานใหม่</button>
      <button class="tab-btn" data-tab="edittask">ปรับปรุงข้อมูล</button>
    </nav>

    <main>
      <!-- ภาพรวม -->
      <section id="tab-overview" class="tab-panel active">
        <div class="cards" id="summaryCards"></div>
        <h2>สรุปตามเจ้าหน้าที่</h2>
        <div class="table-wrap">
          <table class="data-table" id="officerTable">
            <thead>
              <tr>
                <th>ชื่อ</th><th>ทั้งหมด</th><th>ในมือ</th>
                <th>เกินกำหนด</th><th>ใกล้ครบกำหนด</th><th>เสร็จสิ้น</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- งานของฉัน -->
      <section id="tab-mytasks" class="tab-panel">
        <h2>สรุปงานของฉัน</h2>
        <div class="cards" id="myStatCards"></div>
        <h2>รายการงาน</h2>
        <div id="myTasksList" class="task-list"></div>
      </section>

      <!-- งานทั้งหมด (หัวหน้าเท่านั้น) -->
      <section id="tab-alltasks" class="tab-panel">
        <h2>งานทั้งหมด (ทุกเจ้าหน้าที่)</h2>
        <div class="filter-row">
          <label>กรองตามเจ้าหน้าที่
            <select id="filterAssignee"><option value="">ทั้งหมด</option></select>
          </label>
          <label>กรองตามสถานะ
            <select id="filterStatus">
              <option value="">ทั้งหมด</option>
              <option value="เกินกำหนด">เกินกำหนด</option>
              <option value="ใกล้ครบกำหนด">ใกล้ครบกำหนด</option>
              <option value="ปกติ">ปกติ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hideCompleted">
            ไม่แสดงงานที่เสร็จสิ้นแล้ว
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="filterCloseRequested">
            แสดงเฉพาะงานที่ขอปิดงาน
          </label>
        </div>
        <div id="allTasksList" class="task-list"></div>
      </section>

      <!-- เพิ่มงานใหม่ -->
      <section id="tab-addtask" class="tab-panel">
        <h2>เพิ่มงานใหม่</h2>
        <form id="addTaskForm">
          <label>วันที่รับเรื่อง
            <input type="date" id="f_receivedDate" required>
          </label>
          <label>ชื่อเรื่อง
            <input type="text" id="f_title" placeholder="เช่น ตรวจสอบเรื่องร้องเรียน..." required>
          </label>
          <label>ผู้รับผิดชอบ
            <select id="f_assignee" required></select>
          </label>
          <label>กำหนดวันแล้วเสร็จ
            <input type="date" id="f_dueDate" required>
          </label>
          <label>หมายเลขแฟ้ม
            <input type="text" id="f_fileNumber" placeholder="เช่น กท 0501/123">
          </label>
          <label>หมายเหตุ
            <textarea id="f_note" rows="3"></textarea>
          </label>
          <button type="submit">บันทึกงาน</button>
        </form>
        <div id="addTaskMsg"></div>
      </section>

      <!-- ปรับปรุงข้อมูล -->
      <section id="tab-edittask" class="tab-panel">
        <h2>ปรับปรุงข้อมูลงานของฉัน</h2>
        <label class="checkbox-label" style="margin-bottom:10px;">
          <input type="checkbox" id="editHideCompleted">
          ไม่แสดงงานที่เสร็จสิ้นแล้ว
        </label>
        <div id="editTaskList" class="task-list"></div>

        <form id="editTaskForm" class="task-form" style="display:none; margin-top:16px;">
          <input type="hidden" id="e_id">
          <label>ชื่อเรื่อง
            <input type="text" id="e_title" required>
          </label>
          <label>กำหนดวันแล้วเสร็จ
            <input type="date" id="e_dueDate" required>
          </label>
          <label>ความคืบหน้า
            <select id="e_progress">
              <option value="ไม่ได้ดำเนินการ">ไม่ได้ดำเนินการ</option>
              <option value="ระหว่างดำเนินการ">ระหว่างดำเนินการ</option>
              <option value="เสนอหัวหน้าพิจารณา">เสนอหัวหน้าพิจารณา</option>
              <option value="เสนออธิบดีแล้ว">เสนออธิบดีแล้ว</option>
              <option value="อธิบดีลงนามแล้ว">อธิบดีลงนามแล้ว</option>
            </select>
          </label>
          <label>หมายเลขแฟ้ม
            <input type="text" id="e_fileNumber" placeholder="เช่น กท 0501/123">
          </label>
          <label>หมายเหตุ
            <textarea id="e_note" rows="3"></textarea>
          </label>
          <div style="display:flex; gap:8px;">
            <button type="submit">บันทึกการแก้ไข</button>
            <button type="button" id="cancelEditBtn" style="background:#888;">ยกเลิก</button>
          </div>
        </form>
        <div id="editTaskMsg"></div>
      </section>
    </main>
  </div>

  <!-- นำเข้า JavaScript สำหรับ GitHub Pages -->
  <script src="script.js"></script>
</body>
</html>
